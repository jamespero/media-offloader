name: Release

on:
  push:
    branches: [main]
  # Rebuilds the app for an existing release, e.g. if a build failed: run it with the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the apps to (e.g. v0.2.0)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pull requests opened with the default GITHUB_TOKEN don't trigger other workflows,
      # so the release PR's required checks would never run. RELEASE_PLEASE_TOKEN is a
      # fine-grained token (contents + pull requests: read/write) that avoids that.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the app installers and attaches them to the release. Unsigned for now.
  app:
    name: App (${{ matrix.name }})
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            bundles: |
              target/release/bundle/nsis/*-setup.exe
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            bundles: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload the installers to the release
      id-token: write # sign the provenance attestations with this workflow's identity
      attestations: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; installs the current stable Rust
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      # Release builds also produce signed update packages and a latest.json for the
      # in-app updater. That needs the updater's private key, so it's switched on here
      # rather than in tauri.conf.json, and local builds work without the key.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG }}
          includeUpdaterJson: true
          args: '--config {"bundle":{"createUpdaterArtifacts":true}} ${{ matrix.args }}'

      # Publishes a signed record that these installers were built by this workflow from
      # the tagged commit. Check a download with: gh attestation verify <file> --repo <owner/repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.bundles }}
