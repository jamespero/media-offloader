name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    steps:
      # Pull requests opened with the default GITHUB_TOKEN don't trigger other workflows,
      # so the release PR's required checks would never run. RELEASE_PLEASE_TOKEN is a
      # fine-grained token (contents + pull requests: read/write) that avoids that.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
