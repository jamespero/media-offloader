name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect what to build
        id: detect
        shell: bash
        run: |
          echo "rust=${{ hashFiles('crates/*/Cargo.toml', 'app/src-tauri/Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"
          echo "app=${{ hashFiles('app/package.json') != '' }}" >> "$GITHUB_OUTPUT"

      # The app's UI is built first: the Tauri crate embeds app/dist at compile time.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.app == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Typecheck and build the UI
        if: steps.detect.outputs.app == 'true'
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Test the UI
        if: steps.detect.outputs.app == 'true'
        working-directory: app
        run: npm test

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; installs the current stable Rust
        if: steps.detect.outputs.rust == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.detect.outputs.rust == 'true'

      - name: Formatting
        if: steps.detect.outputs.rust == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.detect.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        if: steps.detect.outputs.rust == 'true'
        run: cargo test --workspace

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node .github/scripts/check-versions.mjs
