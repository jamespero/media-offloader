# Keeps dependencies current. GitHub Actions are pinned to commit SHAs, and Dependabot bumps
# the SHA and its version comment together. npm and Cargo share one weekly pull request
# because Tauri's npm packages and Rust crates have to move together (the version
# consistency check fails if their major.minor versions differ).
version: 2

multi-ecosystem-groups:
  app-and-engine:
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /app
    patterns: ["*"]
    multi-ecosystem-group: app-and-engine
    ignore:
      # TypeScript 6 is installed only for svelte-check, which doesn't accept 7 yet (#43).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: app-and-engine
