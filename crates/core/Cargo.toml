[package]
name = "offloader-core"
description = "Copy + verify engine for camera-card offloads (UI-agnostic)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
md-5 = "0.11.0"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Power"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
